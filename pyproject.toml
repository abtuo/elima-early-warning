[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elima-early-warning-open"
version = "0.1.0"
description = "Transparent, privacy-aware education early warning baseline"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Elima"}]
dependencies = ["fastapi>=0.110,<1", "pydantic>=2,<3", "uvicorn>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.26,<1"]

[project.scripts]
elima-ew = "elima_early_warning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
